<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webefy Sales CRM</title><meta name="description" content="Webefy internal caller sales CRM">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand">webefy<span>.</span></div><div class="muted">Sales CRM</div>
  <nav id="nav">
    <button class="nav-item active" data-page="dashboard">▦ <span>Dashboard</span></button>
    <button class="nav-item" data-page="leads">◉ <span>My Leads</span></button>
    <button class="nav-item" data-page="followups">◷ <span>Follow-ups</span></button>
    <button class="nav-item" data-page="sales">₹ <span>Sales</span></button>
    <button class="nav-item" data-page="commission">⌁ <span>Commission</span></button>
    <button class="nav-item" data-page="settings">⚙ <span>Settings</span></button>
  </nav>
  <div class="profile"><div class="avatar">CA</div><div><b id="profileName">Caller</b><small id="profileRole">Sales Executive</small></div></div>
</aside>
<main>
<header class="topbar"><div><p class="eyebrow">WEBEFY SALES SYSTEM</p><h1 id="pageTitle">Good morning 👋</h1><p class="muted" id="pageSub">Track calls, qualified leads, sales and earnings.</p></div><div class="top-actions"><button class="ghost" id="roleBtn">Caller mode</button><button class="primary" id="addLeadBtn">+ Add Lead</button></div></header>
<div id="app"></div>
</main>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Add Lead</h2><button class="icon-btn" id="closeModal">×</button></div><form id="leadForm"><input type="hidden" id="leadId"><label>Business name<input id="business" required></label><label>Contact name<input id="contact"></label><label>Phone<input id="phone" required></label><div class="two"><label>Category<input id="category"></label><label>Location<input id="location"></label></div><label>Status<select id="status"><option>New</option><option>Follow-up</option><option>WhatsApp Details</option><option>Qualified</option><option>Not Interested</option><option>No Answer</option><option>Wrong Number</option></select></label><label>Follow-up date/time<input id="followup" type="datetime-local"></label><label>Notes<textarea id="notes" rows="3"></textarea></label><div class="form-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary" type="submit">Save Lead</button></div></form></div></div>
<script src="app.js"></script>
</body></html>
