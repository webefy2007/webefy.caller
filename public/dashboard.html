<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Webefy CRM</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="topbar"><span>Webefy CRM</span><button class="btn btn-sm" onclick="logout()">Logout</button></div>
<div class="container">
<div class="card">
<h3>Add New Lead</h3>
<div class="flex">
<input id="name" class="input" placeholder="Name">
<input id="phone" class="input" placeholder="Phone">
<input id="status" class="input" placeholder="Status (New/Callback/Won)" value="New">
<button class="btn" onclick="addLead()">Add</button>
</div>
</div>
<div class="card">
<h3>Leads</h3>
<table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Action</th></tr></thead><tbody id="leadsBody"></tbody></table>
</div>
</div>
<script>
if(!localStorage.getItem('token')) location.href='/';
function logout(){ localStorage.removeItem('token'); location.href='/'; }
async function load(){
  const res = await fetch('/api/clients', {headers:{Authorization:'Bearer '+localStorage.getItem('token')}});
  const data = await res.json();
  const body = document.getElementById('leadsBody');
  body.innerHTML = '';
  data.forEach(c=>{
    body.innerHTML+=`<tr><td>${c.name}</td><td>${c.phone}</td><td><span class="badge badge-${c.status?.toLowerCase()}">${c.status}</span></td><td><button class="btn btn-sm btn-danger" onclick="del('${c.id}')">Delete</button></td></tr>`;
  });
}
async function addLead(){
  const name=document.getElementById('name').value, phone=document.getElementById('phone').value, status=document.getElementById('status').value;
  await fetch('/api/clients', {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+localStorage.getItem('token')}, body:JSON.stringify({name,phone,status})});
  load();
}
async function del(id){
  await fetch('/api/clients/'+id, {method:'DELETE', headers:{Authorization:'Bearer '+localStorage.getItem('token')}});
  load();
}
load();
</script>
</body></html>
